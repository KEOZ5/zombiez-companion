name: Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Gradle wrapper JAR
        run: |
          # Use system Gradle in a temp empty project to generate the wrapper JAR
          SYS_GRADLE=$(which gradle 2>/dev/null || echo "")
          if [ -z "$SYS_GRADLE" ]; then
            echo "No system Gradle found – downloading"
            wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
            SYS_GRADLE=/opt/gradle-8.10/bin/gradle
          fi
          echo "Using Gradle: $SYS_GRADLE"
          $SYS_GRADLE --version
          # Generate wrapper in an isolated empty project
          TMPPROJ=$(mktemp -d)
          echo "" > "$TMPPROJ/settings.gradle"
          (cd "$TMPPROJ" && $SYS_GRADLE wrapper --gradle-version=8.10 -q)
          cp "$TMPPROJ/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          echo "Wrapper JAR size: $(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes"

      - name: Build
        run: ./gradlew build --stacktrace 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}

      - name: Show error log
        if: failure()
        run: |
          echo "## Build Output (last 200 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -100 /tmp/build.log

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zombiez-companion-jar
          path: build/libs/zombiez-companion-*.jar
          retention-days: 30
