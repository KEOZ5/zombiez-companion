name: Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          export PATH="/opt/gradle-8.10/bin:$PATH"
          java -version 2>&1
          gradle --version 2>&1
          gradle build --stacktrace 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          exit $BUILD_EXIT

      - name: Show build log on failure
        if: failure()
        run: |
          echo "## Build Output (last 150 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -150 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -150 /tmp/build.log

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zombiez-companion-jar
          path: build/libs/zombiez-companion-*.jar
          retention-days: 30
