name: Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Debug environment
        run: |
          which gradle || echo "no system gradle"
          gradle --version || echo "gradle --version failed"
          java -version
          ls -la
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Download Gradle wrapper JAR
        run: |
          GRADLE_VER=8.10
          DIST_URL=https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip
          wget -q "$DIST_URL" -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          cp /tmp/gradle-dist/gradle-${GRADLE_VER}/lib/gradle-wrapper-*.jar gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
            cp /tmp/gradle-dist/gradle-${GRADLE_VER}/lib/plugins/gradle-wrapper*.jar gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
            find /tmp/gradle-dist -name "gradle-wrapper*.jar" -exec cp {} gradle/wrapper/gradle-wrapper.jar \;
          chmod +x gradlew
          ls -lah gradle/wrapper/

      - name: Build
        run: ./gradlew build --stacktrace 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}

      - name: Show error log
        if: failure()
        run: |
          echo "=== LAST 200 LINES OF BUILD LOG ===" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -100 /tmp/build.log

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zombiez-companion-jar
          path: build/libs/zombiez-companion-*.jar
          retention-days: 30
